[workspace]
members = [".", "crates/jmux-core", "crates/jmux-tui"]
resolver = "2"

[package]
name = "jmux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jmux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
jmux-core = { path = "crates/jmux-core" }
jmux-tui = { path = "crates/jmux-tui" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
dirs-next = "2"

[dev-dependencies]
# Installs git hooks automatically when `cargo test` is run
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
